<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Inés G. Calvo">
  <meta name="description" content="{% block meta_desc %}Inés González Calvo — Data Scientist & Neuroscientist. Portfolio, CV, and AI projects.{% endblock %}">
  <title>{% block title %}Inés G. Calvo{% endblock %} · Data Scientist & Neuroscientist</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo_inesgcalvo.png') }}" onerror="this.remove()">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <div class="grain-overlay"></div>

  <!-- Navigation -->
  <nav class="app-nav" id="app-nav">
    <div class="nav-inner">
      <a href="{{ url_for('home') }}" class="nav-monogram">IGC</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('cv') }}"          class="nav-link {% if request.endpoint == 'cv' %}active{% endif %}">CV</a></li>
        <li><a href="{{ url_for('projects') }}"    class="nav-link {% if request.endpoint == 'projects' %}active{% endif %}">Projects</a></li>
        <li><a href="{{ url_for('neuropapers') }}" class="nav-link nav-model {% if request.endpoint == 'neuropapers' %}active{% endif %}">
          <span class="model-dot"></span>Neuropapers
        </a></li>
      </ul>
      <div class="nav-socials">
        <a href="https://github.com/inesgcalvo" target="_blank" class="social-icon" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.167 6.839 9.489.5.092.682-.217.682-.483 0-.237-.009-.868-.013-1.703-2.782.605-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.841-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .268.18.58.688.482C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/ines-g-calvo" target="_blank" class="social-icon" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-inner">
      <span class="footer-ornament">✦</span>
      <p class="footer-name">Inés González Calvo, Ph.D.</p>
      <div class="footer-links">
        <a href="{{ url_for('cv') }}">CV</a>
        <span>·</span>
        <a href="{{ url_for('projects') }}">Projects</a>
        <span>·</span>
        <a href="{{ url_for('neuropapers') }}">Neuropapers</a>
        <span>·</span>
        <a href="https://github.com/inesgcalvo" target="_blank">GitHub ↗</a>
        <span>·</span>
        <a href="https://www.linkedin.com/in/ines-g-calvo" target="_blank">LinkedIn ↗</a>
      </div>
      <p class="footer-copy">© <span id="year"></span> Inés G. Calvo · inglez@gmail.com</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
