name: Update citation counts

# Refreshes the citation counts on publications.html from Crossref.
# Weekly is plenty: these numbers move by a handful per month.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:       # ...and on demand from the Actions tab

permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish:
# two jobs committing to main at once would just conflict.
concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the counts from Crossref
        run: python3 scripts/update_citations.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- publications.html; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html
          git commit -m "update citation counts from Crossref"
          git push
